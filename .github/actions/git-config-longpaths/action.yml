name: 'Set core.longPaths'
description: 'Set git-config core.longPaths'

runs:
  using: "composite"

  steps:
    - name: Set `core.longPaths`
      id: set-git-longpaths
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --system core.longPaths true

    - name: Get `core.longPaths`
      id: get-git-longPaths
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --system --get core.longPaths
