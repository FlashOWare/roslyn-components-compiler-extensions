name: .NET Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test_dotnet:
    name: test dotnet in ${{ matrix.configuration }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        configuration: [Debug, Release]
    env:
      Solution_File: ./source/FlashOWare.CodeAnalysis.slnx
      Build_Configuration: ${{ matrix.configuration }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: ./global.json
    - name: .NET information
      run: dotnet --info
    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_File }}
    - name: Build Solution
      run: dotnet build ${{ env.Solution_File }} --configuration ${{ env.Build_Configuration }} --no-restore --nologo
    - name: Test Solution
      run: dotnet test ${{ env.Solution_File }} --configuration ${{ env.Build_Configuration }} --no-build --verbosity normal
